name: Create Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (optional)'
        required: false
        type: string
      number:
        description: 'Version code (optional)'
        required: false
        type: string
      channel:
        description: 'Release channel'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - beta
          - alpha
          - internal

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Create release.keystore
        env:
          AUTH: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo $AUTH | base64 --decode > /tmp/release.keystore
        shell: bash

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Publish to Google Play
        env:
          APP_SIGN_KEYSTORE_PATH: /tmp/release.keystore
          APP_SIGN_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_SIGN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_SIGN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_VERSION_NAME: ${{ inputs.version || github.ref_name }}
          APP_VERSION_CODE: ${{ inputs.number || github.run_number }}
          SUPPLY_TRACK: ${{ (inputs.channel == 'public' && 'production') || inputs.channel || 'production' }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: bundle exec fastlane deploy
