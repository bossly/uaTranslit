name: Pull request

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build and running Unit Tests
    runs-on: ubuntu-latest

    timeout-minutes: 30
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run Unit Tests
        env:
          APP_BUILD_NUMBER: ${{ env.GITHUB_RUN_ID }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: bundle exec fastlane unit_test

      - name: Publish Android Test Report Preview
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'
          annotate_only: false
          detailed_summary: true
          check_name: 'Android Test Results'

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/build/test-results/
            app/build/reports/tests/
